<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:54321 http://localhost:54321 https://fuesdztsvrkkgnbqhcxi.supabase.co wss://fuesdztsvrkkgnbqhcxi.supabase.co https://mvzcoaiiwytycdqcvydf.supabase.co wss://mvzcoaiiwytycdqcvydf.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Ogritech | Nova senha</title>
    <link rel="icon" href="ogritech-favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="ogritech-brand-symbol.png">
    <link rel="apple-touch-icon" href="ogritech-brand-symbol.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-wrapper">
        <section class="login-card">
            <a class="ogritech-lockup header-logo-link" href="./" aria-label="Ir para a página principal da Ogritech">
                <img src="ogritech-brand-symbol.png" alt="" class="ogritech-lockup-symbol">
                <img src="ogritech-logo.png" alt="Ogritech" class="ogritech-lockup-name">
            </a>

            <p class="eyebrow platform-eyebrow">SEU CARDÁPIO DIGITAL</p>
            <h1 class="login-title">Definir nova senha</h1>
            <p class="login-subtitle">
                Valide o link do e-mail para escolher sua senha com segurança.
            </p>

            <button id="confirmAccessButton" type="button" class="gold-button full hidden">Continuar com o link do e-mail</button>
            <p id="accessLinkMessage" class="login-message" role="status">Verificando o link de acesso...</p>

            <form id="updatePasswordForm" class="login-form hidden">
                <label>
                    Nova senha
                    <span class="password-field">
                        <input
                            type="password"
                            id="newPassword"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password-toggle" data-password-target="newPassword" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
                            <span class="password-eye" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                    <circle cx="12" cy="12" r="2.8"></circle>
                                    <path class="password-eye-slash" d="M4 4 20 20"></path>
                                </svg>
                            </span>
                        </button>
                    </span>
                </label>

                <label>
                    Confirmar nova senha
                    <span class="password-field">
                        <input
                            type="password"
                            id="confirmPassword"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password-toggle" data-password-target="confirmPassword" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
                            <span class="password-eye" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                    <circle cx="12" cy="12" r="2.8"></circle>
                                    <path class="password-eye-slash" d="M4 4 20 20"></path>
                                </svg>
                            </span>
                        </button>
                    </span>
                </label>

                <p id="updatePasswordMessage" class="login-message">
                    Use pelo menos 8 caracteres, com maiúscula, minúscula, número e símbolo.
                </p>

                <button type="submit" class="gold-button full">
                    Salvar nova senha
                </button>
            </form>

            <p id="invalidRecoveryMessage" class="login-message hidden"></p>

            <a href="/login/" id="backToLoginLink" class="text-button full">
                Voltar ao login
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
    <script src="supabase-config.js?v=20261022.4"></script>
    <script src="update-password.js?v=20261022.4"></script>
    <script src="pwa.js?v=20260831.2"></script>
</body>
</html>

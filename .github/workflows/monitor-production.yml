name: Monitor production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Produção ou ensaio isolado sem serviços reais"
        type: choice
        options: [production, drill]
        default: production

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-${{ inputs.mode || 'production' }}
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ inputs.mode != 'drill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      MENU_HEALTH_URL: ${{ vars.MENU_HEALTH_URL }}
      MENU_HEALTH_PUBLISHABLE_KEY: ${{ vars.MENU_HEALTH_PUBLISHABLE_KEY }}
      MONITOR_WINDOW_MINUTES: "20"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Consult production telemetry
        id: monitor
        continue-on-error: true
        run: node scripts/monitor-production.mjs
      - name: Publish or resolve operational incident
        uses: actions/github-script@v8
        env:
          REPORT: ${{ steps.monitor.outputs.report }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        with:
          script: |
            const { synchronizeIncident, validateReport } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/monitor-incident.mjs`);
            let report;
            try { report = JSON.parse(process.env.REPORT); validateReport(report); } catch {
              report = { failures: ["Monitor falhou antes de produzir o relatório; recuperação não confirmada"] };
            }
            if (process.env.MONITOR_OUTCOME !== "success" && !report.failures?.length) {
              report.failures = ["Execução do monitor falhou; recuperação não confirmada"];
            }
            await synchronizeIncident({ github, repo: context.repo, report,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            if (report.failures.length) core.setFailed("O monitor de produção detectou uma condição de alerta.");

  drill:
    if: ${{ inputs.mode == 'drill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Exercise isolated alert and recovery
        uses: actions/github-script@v8
        with:
          script: |
            const { runMonitorDrill } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/monitor-drill.mjs`);
            const result = await runMonitorDrill({ github, repo: context.repo,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            core.info(JSON.stringify(result));
            await core.summary.addHeading("Ensaio isolado do monitor do Cardápio")
              .addCodeBlock(JSON.stringify(result, null, 2), "json").write();

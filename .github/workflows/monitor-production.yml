name: Monitor production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-production
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      MENU_HEALTH_URL: ${{ vars.MENU_HEALTH_URL }}
      MONITOR_WINDOW_MINUTES: "20"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Consult production telemetry
        id: monitor
        continue-on-error: true
        run: node scripts/monitor-production.mjs
      - name: Publish or resolve operational incident
        uses: actions/github-script@v8
        env:
          REPORT: ${{ steps.monitor.outputs.report }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        with:
          script: |
            const title = "[Monitor] Alerta operacional de produção";
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: "production-monitor" });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: "production-monitor",
                color: "b60205",
                description: "Incidente detectado pelo monitor automático de produção"
              });
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "production-monitor",
              per_page: 10
            });
            const incident = issues.find((issue) => issue.title === title);
            const report = process.env.REPORT || "Monitor falhou antes de produzir o relatório.";
            if (process.env.MONITOR_OUTCOME !== "success") {
              const body = `O monitor detectou um limite excedido ou falha de coleta.\n\n\`\`\`json\n${report}\n\`\`\`\n\nExecução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              if (incident) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: incident.number, body });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body, labels: ["production-monitor"] });
              }
              core.setFailed("O monitor de produção detectou uma condição de alerta.");
            } else if (incident) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: incident.number,
                body: `Condição normalizada. Relatório: \`${report}\``
              });
              await github.rest.issues.update({ ...context.repo, issue_number: incident.number, state: "closed" });
            }

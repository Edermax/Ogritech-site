name: Backup production database

on:
  schedule:
    # 03:20 UTC = 00:20 em America/Sao_Paulo (UTC-3).
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt and retain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL is not configured" >&2; exit 1; }
          test -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" || { echo "BACKUP_ENCRYPTION_PASSPHRASE is not configured" >&2; exit 1; }
          test "${#BACKUP_ENCRYPTION_PASSPHRASE}" -ge 32 || { echo "The encryption passphrase must have at least 32 characters" >&2; exit 1; }

      - name: Create logical dumps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql \
            --use-copy --data-only \
            --schema public,private
          {
            echo 'revoke execute on all functions in schema public from public, anon, authenticated, service_role;'
            echo 'revoke execute on all functions in schema private from public, anon, authenticated, service_role;'
            psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --variable ON_ERROR_STOP=1 <<'SQL'
          select format(
            'grant %s on function %I.%I(%s) to %s%s;',
            upper(acl.privilege_type),
            namespace.nspname,
            procedure.proname,
            pg_get_function_identity_arguments(procedure.oid),
            case when acl.grantee = 0 then 'PUBLIC' else quote_ident(grantee.rolname) end,
            case when acl.is_grantable then ' with grant option' else '' end
          )
          from pg_proc procedure
          join pg_namespace namespace on namespace.oid = procedure.pronamespace
          cross join lateral aclexplode(coalesce(procedure.proacl, acldefault('f', procedure.proowner))) acl
          left join pg_roles grantee on grantee.oid = acl.grantee
          where namespace.nspname in ('public', 'private')
            and (acl.grantee = 0 or grantee.rolname in ('anon', 'authenticated', 'service_role'))
          order by namespace.nspname, procedure.proname, acl.grantee, acl.privilege_type;
          SQL
          } > backup/function-acl.sql
          test -s backup/schema.sql
          test -s backup/data.sql
          test -s backup/function-acl.sql
          grep -q 'transition_appointment_status' backup/function-acl.sql
          if grep -Eiq '^COPY[[:space:]]+("?auth"?|"?storage"?)\.' backup/data.sql; then
            echo "Managed auth/storage data was not excluded" >&2
            exit 1
          fi

      - name: Encrypt backup
        id: encrypt
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="ogritech-production-${stamp}.tar.gz"
          encrypted="${archive}.enc"
          tar -czf "$archive" backup
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in "$archive" -out "$encrypted" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          sha256sum "$encrypted" > "${encrypted}.sha256"
          rm -rf backup "$archive"
          echo "artifact_name=ogritech-production-${stamp}" >> "$GITHUB_OUTPUT"
          echo "encrypted_file=${encrypted}" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.encrypt.outputs.artifact_name }}
          path: |
            ${{ steps.encrypt.outputs.encrypted_file }}
            ${{ steps.encrypt.outputs.encrypted_file }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish or resolve backup incident
        if: always()
        uses: actions/github-script@v8
        env:
          BACKUP_STATUS: ${{ job.status }}
        with:
          script: |
            const title = "[Backup] Falha no backup diário de produção";
            const label = "production-backup";
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "b60205",
                description: "Falha na geração ou retenção do backup criptografado"
              });
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: label, per_page: 10
            });
            const incident = issues.find((issue) => issue.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (process.env.BACKUP_STATUS !== "success") {
              const body = `O backup diário criptografado não foi concluído.\n\nExecução: ${runUrl}`;
              if (incident) await github.rest.issues.createComment({ ...context.repo, issue_number: incident.number, body });
              else await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
            } else if (incident) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: incident.number,
                body: `O backup voltou a concluir normalmente. Execução: ${runUrl}`
              });
              await github.rest.issues.update({ ...context.repo, issue_number: incident.number, state: "closed" });
            }

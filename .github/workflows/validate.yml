name: Validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm run validate
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with: { version: 2.116.0 }
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db

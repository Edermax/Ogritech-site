name: Validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - name: Prepare immutable Cardapio release package
        run: |
          mkdir -p outputs
          node scripts/menu-release-package.mjs > outputs/menu-release-package.json
          node scripts/menu-production-rollback-rehearsal.mjs --http > outputs/menu-rollback-http.json
      - uses: actions/upload-artifact@v7
        with:
          name: menu-release-package-${{ github.sha }}
          path: |
            outputs/menu-release-package.json
            outputs/menu-rollback-http.json
          retention-days: 7
          if-no-files-found: error
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with: { version: 2.116.0 }
      - run: supabase start --exclude mailpit
      - run: supabase db reset
      - run: supabase test db
      - run: python3 scripts/test-menu-offer-concurrency.py
  panel-theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:panel-theme-browser
      - run: npm run test:account-theme-browser
      - run: npm run test:panel-navigation-browser
      - run: npm run test:admin-theme-browser
      - run: npm run test:admin-navigation-browser
      - run: node scripts/split-offers-browser.mjs
      - run: node scripts/menu-theme-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: panel-theme-review-${{ github.sha }}
          path: |
            outputs/panel-theme-review/
            outputs/panel-navigation/
            outputs/admin-navigation/
            outputs/split-offers/
            outputs/menu-light-theme/
          retention-days: 7
          if-no-files-found: ignore

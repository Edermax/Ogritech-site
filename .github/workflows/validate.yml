name: Validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - name: Prepare immutable Cardapio release package
        run: |
          mkdir -p outputs
          node scripts/menu-release-package.mjs > outputs/menu-release-package.json
          node scripts/menu-production-rollback-rehearsal.mjs --http > outputs/menu-rollback-http.json
      - uses: actions/upload-artifact@v7
        with:
          name: menu-release-package-${{ github.sha }}
          path: |
            outputs/menu-release-package.json
            outputs/menu-rollback-http.json
          retention-days: 7
          if-no-files-found: error
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with: { version: 2.116.0 }
      - run: supabase start --exclude mailpit
      - run: supabase db reset
      - run: supabase test db

name: Go-live readiness evidence

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - name: Validate repository
        run: npm run validate
      - name: Evaluate Cardapio go-live gate
        id: launch_gate
        continue-on-error: true
        env:
          VALIDATION_STATUS: passed
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run gate:go-live
      - name: Audit public DNS, pages and security
        id: public_audit
        continue-on-error: true
        run: npm run audit:public
      - name: Audit links and accessible HTML contracts
        id: integrity_audit
        continue-on-error: true
        run: npm run audit:integrity
      - uses: supabase/setup-cli@v3
        with: { version: 2.116.0 }
      - name: Validate database permissions and Cardapio orders in isolated local database
        id: resilience
        continue-on-error: true
        run: |
          supabase start --exclude mailpit
          supabase db reset
          supabase test db
      - name: Build evidence package
        if: always()
        env:
          DATABASE_VALIDATION_STATUS: ${{ steps.resilience.outcome }}
        run: npm run evidence:go-live
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-live-readiness-${{ github.run_number }}
          path: outputs/go-live/
          retention-days: 30
      - name: Enforce technical readiness
        if: steps.launch_gate.outcome != 'success' || steps.public_audit.outcome != 'success' || steps.integrity_audit.outcome != 'success' || steps.resilience.outcome != 'success'
        run: exit 1

<body class="login-page ogri-light">

    <!-- =====================================================
         TELA DE LOGIN

         IMPORTANTE:
         O usuário não precisa escolher visualmente o seu perfil.

         O JavaScript identifica automaticamente se o acesso é de:
         - Proprietário
         - Funcionário
         - Cliente

         Isso acontece através do e-mail e senha informados.
         ===================================================== -->
    <main class="login-wrapper">

        <section class="login-card">

            <!-- Marca da plataforma -->
            <a class="ogritech-lockup header-logo-link site-brand" href="./" aria-label="Ir para a página principal da Ogritech"><img src="/ogritech-brand-symbol.png" alt="" width="44" height="44"><span>Ogritech</span></a>

            <!-- Identidade da tela -->
            <p class="eyebrow platform-eyebrow">OGRITECH CARDÁPIO</p>
            <h1 class="login-title">Acessar sistema</h1>

            <p class="login-subtitle">
                Entre com seu e-mail e senha.
            </p>

            <!-- =================================================
                 FORMULÁRIO DE LOGIN
                 ================================================= -->
            <form id="loginForm" class="login-form">

                <!-- Campo de e-mail -->
                <label>
                    E-mail

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </label>

                <!-- Campo de senha -->
                <label>
                    Senha

                    <span class="password-field">
                        <input
                            type="password"
                            id="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            id="togglePasswordButton"
                            class="password-toggle"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                            title="Mostrar senha"
                        >
                            <span class="password-eye" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                    <circle cx="12" cy="12" r="2.8"></circle>
                                    <path class="password-eye-slash" d="M4 4 20 20"></path>
                                </svg>
                            </span>
                        </button>
                    </span>
                </label>

                <!-- Mensagem de erro ou sucesso -->
                <p id="loginMessage" class="login-message"></p>

                <!-- Botão de entrada -->
                <button
                    type="submit"
                    class="gold-button full"
                >
                    Entrar
                </button>

                <button
                    type="button"
                    id="forgotPasswordButton"
                    class="text-button full"
                >
                    Esqueci minha senha
                </button>

            </form>

            <p class="privacy-links">Ao acessar, você declara ciência dos <a href="termos.html">Termos de Uso</a> e da <a href="privacidade.html">Política de Privacidade</a>.<br>Precisa de ajuda? <a href="mailto:suporte@ogritech.com.br">suporte@ogritech.com.br</a></p>

        </section>

    </main>

    <!-- Cliente oficial do Supabase e configuração pública do projeto -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
    <script src="supabase-config.js"></script>

    <!-- Lógica do login -->
    <script src="login.js?v=20261105.1"></script>

</body>

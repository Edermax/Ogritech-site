project_id = "ogritech-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://localhost:8080/update-password.html"]

[analytics]
enabled = false

[functions.platform-users]
verify_jwt = true

[functions.assistant-email-dispatch]
verify_jwt = true

[functions.ogritech-billing]
verify_jwt = false

[functions.mercado-pago-webhook]
verify_jwt = false

[functions.billing-email-dispatch]
verify_jwt = false

[functions.billing-lifecycle]
verify_jwt = false

[functions.menu-ai-assistant]
enabled = true
verify_jwt = false
import_map = "./functions/menu-ai-assistant/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/menu-ai-assistant/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/menu-ai-assistant/*.html" ]
